name: Release

on:
  workflow_dispatch:
    inputs:
      npm_publish_mode:
        description: What to do with the npm package
        required: true
        default: skip
        type: choice
        options:
          - skip
          - dry-run
          - publish
      npm_tag:
        description: npm dist-tag
        required: true
        default: latest
        type: string
      github_release_mode:
        description: What to do with the GitHub Release
        required: true
        default: skip
        type: choice
        options:
          - skip
          - draft
          - publish

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "releases are restricted to main"
          exit 1

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Run release gates
        run: |
          npm audit --audit-level=high
          npm audit signatures
          npm run check
          npm run package:check

      - name: Read release metadata
        id: metadata
        run: echo "version=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"

  publish-npm:
    name: ${{ inputs.npm_publish_mode == 'publish' && 'Publish' || 'Dry run' }} npm package
    if: inputs.npm_publish_mode != 'skip'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node and npm registry
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Verify version is unpublished
        run: |
          package_name=$(node -p 'require("./package.json").name')
          package_version=$(node -p 'require("./package.json").version')
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published"
            exit 1
          fi

      - name: Dry-run publication
        if: inputs.npm_publish_mode == 'dry-run'
        run: npm publish --dry-run --access public --tag "${{ inputs.npm_tag }}"

      - name: Publish with npm trusted publishing
        if: inputs.npm_publish_mode == 'publish'
        run: npm publish --access public --tag "${{ inputs.npm_tag }}"

  github-release:
    name: ${{ inputs.github_release_mode == 'draft' && 'Draft' || 'Publish' }} GitHub Release
    if: inputs.github_release_mode != 'skip'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Render release notes
        run: node scripts/release-notes.mjs --body > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.github_release_mode }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release ${tag} already exists"
            exit 1
          fi

          args=(
            gh release create "$tag"
            --target "$GITHUB_SHA"
            --title "Seat Monitor ${tag}"
            --notes-file "$RUNNER_TEMP/release-notes.md"
          )
          if [ "$RELEASE_MODE" = "draft" ]; then
            args+=(--draft)
          fi
          "${args[@]}"
