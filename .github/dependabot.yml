version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:20"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint 8.68 declares TypeScript support only below 6.1.
      - dependency-name: typescript
        versions:
          - 7.x
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:40"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
